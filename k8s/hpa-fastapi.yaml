apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qvalidate-fastapi-hpa
  namespace: qvalidate-system
  labels:
    app: qvalidate-control-plane
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qvalidate-control-plane
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70


