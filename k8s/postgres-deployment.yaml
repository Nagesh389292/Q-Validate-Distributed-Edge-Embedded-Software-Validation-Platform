apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  namespace: qvalidate-system
  labels:
    app: postgres-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "qvalidate_db"
        - name: POSTGRES_USER
          value: "qvalidate"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: qvalidate-secrets
              key: postgres-password
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "qvalidate"]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "qvalidate"]
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: qvalidate-system
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres-db
