apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qvalidate-ingress
  namespace: qvalidate-system
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - host: qvalidate.local
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: qvalidate-control-plane-service
            port:
              number: 8000
      - path: /(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: qvalidate-frontend-service
            port:
              number: 3000
