apiVersion: v1
kind: ConfigMap
metadata:
  name: qvalidate-config
  namespace: qvalidate-system
data:
  DATABASE_BACKEND: "postgres"
  LOG_LEVEL: "INFO"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
---
apiVersion: v1
kind: Secret
metadata:
  name: qvalidate-secrets
  namespace: qvalidate-system
type: Opaque
data:
  postgres-password: c2VjcmV0cGFzc3dvcmQ= # Base64 for "secretpassword"
